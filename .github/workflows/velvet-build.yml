name: Velvet Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      app_id_variant:
        description: "Application id variant suffix (velvet => dev.pranav.applock.velvet)"
        default: "velvet"
        required: false
      minify:
        description: "Enable R8 minification (true/false)"
        default: "false"
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2

      - name: Install SDK platform 37
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" 2>&1 | tail -5 || \
            sdkmanager "platforms;android-37" 2>&1 | tail -5

      - name: Decode signing keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            echo "Keystore decoded: $(stat -c%s "$GITHUB_WORKSPACE/release.keystore") bytes"
          else
            echo "No keystore secret, falling back to debug signing"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.1

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build arm64 release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:assembleRelease \
            -Pvelvet.appIdSuffix="${{ github.event.inputs.app_id_variant || 'velvet' }}" \
            -Pvelvet.minify="${{ github.event.inputs.minify || 'false' }}" \
            -Pvelvet.abis=arm64-v8a \
            --stacktrace

      - name: Locate APK
        run: |
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK
        uses: actions/upload-artifact@v4.6.2
        with:
          name: applock-velvet-arm64
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
          retention-days: 14
